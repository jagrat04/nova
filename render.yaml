# Render blueprint for the NOVA API.
# The database lives on Neon (or any managed Postgres); set DATABASE_URL in the
# Render dashboard rather than committing it here.
services:
  - type: web
    name: nova-api
    runtime: node
    rootDir: server
    plan: free
    # --include=dev is required: NODE_ENV=production below would otherwise make
    # npm ci skip typescript, tsx and the prisma CLI, which the build needs.
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
